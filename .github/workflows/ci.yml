name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, lint and types (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The service worker test runs sw.js under node and fails (not skips) when CI is set.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: pytest (80% coverage gate from pyproject)
        run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: mypy --strict (app, tests, migrations)
        run: uv run mypy

  postgres:
    name: Migrations and full suite (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for a CI-only container that is gone when the job ends.
        env:
          POSTGRES_USER: bruge
          POSTGRES_PASSWORD: bruge
          POSTGRES_DB: bruge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bruge -d bruge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # POSTGRES_USER above is a superuser, and superusers skip row-level security. So the tests
      # connect as bruge_owner (owns the database, no superuser, no BYPASSRLS), created below.
      DATABASE_URL: postgresql+psycopg://bruge_owner:bruge_owner@localhost:5432/bruge_test
      TEST_DATABASE_URL: postgresql+psycopg://bruge_owner:bruge_owner@localhost:5432/bruge_test
      # The separate application role; the RLS tests run once as it and once as the owner alone
      # (single-role mode), so both ways of deploying are covered.
      TEST_APP_DATABASE_URL: postgresql+psycopg://bruge_app:bruge_app@localhost:5432/bruge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The full suite includes the service worker test, which needs node when CI is set.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Create the owner and application roles (throwaway CI credentials)
        run: |
          psql "postgresql://bruge:bruge@localhost:5432/bruge_test" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bruge_owner LOGIN PASSWORD 'bruge_owner' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE bruge_app LOGIN PASSWORD 'bruge_app' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE bruge_test OWNER TO bruge_owner;
          SQL
      - name: alembic upgrade, downgrade, upgrade (single-role mode, no APP_DB_ROLE)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic downgrade base
      - name: alembic upgrade, downgrade, upgrade (APP_DB_ROLE=bruge_app)
        env:
          APP_DB_ROLE: bruge_app
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Full test suite against Postgres (RLS tests in both modes)
        # The 80% coverage gate stays with the SQLite run; Postgres-only tests run here.
        run: uv run pytest --no-cov -rs

  docker:
    name: Docker image and /healthz (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for a CI-only container that is gone when the job ends.
        env:
          POSTGRES_USER: bruge
          POSTGRES_PASSWORD: bruge
          POSTGRES_DB: bruge_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bruge -d bruge_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # postgres:// on purpose: it exercises the URL normalization the Render URLs rely on.
      DB_URL: postgres://bruge:bruge@localhost:5432/bruge_smoke
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag bruge-accountant:ci .
      - name: init-db inside the image (same command as preDeployCommand)
        run: >-
          docker run --rm --network host -e DATABASE_URL="$DB_URL"
          bruge-accountant:ci python -m app init-db
      - name: Start the app in production mode
        run: >-
          docker run --detach --name app --network host
          -e PORT=8000 -e ENV=production -e ALLOWED_HOSTS=localhost,127.0.0.1
          -e DATABASE_URL="$DB_URL" -e RENDER_GIT_COMMIT="$GITHUB_SHA"
          bruge-accountant:ci
      - name: Wait for /healthz to return 200 (60 s timeout)
        run: |
          deadline=$((SECONDS + 60))
          until curl --fail --silent --show-error http://localhost:8000/healthz -o health.json; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timeout: /healthz never returned 200"
              docker logs app
              exit 1
            fi
            sleep 2
          done
          cat health.json
          grep -q "\"version\": *\"$GITHUB_SHA\"" health.json
      - name: Error page and headers
        run: |
          curl --silent --dump-header headers.txt --output body.html http://localhost:8000/nope
          cat headers.txt
          head -n 1 headers.txt | grep -q " 404"
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^strict-transport-security:' headers.txt
          grep -qi '^x-request-id:' headers.txt
          if grep -qi '^server:' headers.txt; then echo "server header leaked"; exit 1; fi
          grep -q "Page introuvable" body.html
      - name: Runs as non-root and shuts down cleanly on SIGTERM
        run: |
          test "$(docker exec app id -u)" != "0"
          docker stop --time 10 app
          test "$(docker inspect --format '{{.State.ExitCode}}' app)" = "0"
      - name: Container logs
        if: always()
        run: docker logs app

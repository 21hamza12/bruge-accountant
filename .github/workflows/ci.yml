name: CI

on:
  # Pull requests are tested once; branch pushes are not tested again (that doubled the
  # minutes). main is tested after each merge. Documentation-only changes skip the suite.
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, lint and types (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 40  # ~21 min after phase F (Oct 2026); the suite grows with each phase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The service worker test runs sw.js under node and fails (not skips) when CI is set.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: pytest (80% coverage gate from pyproject)
        run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: mypy --strict (app, tests, migrations)
        run: uv run mypy

  postgres:
    name: Migrations and full suite (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 90  # full Postgres suite in both RLS modes; ~40-55 min after phase F (Oct 2026), split into parallel jobs if it nears 75
    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for a CI-only container that is gone when the job ends.
        env:
          POSTGRES_USER: bruge
          POSTGRES_PASSWORD: bruge
          POSTGRES_DB: bruge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bruge -d bruge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # POSTGRES_USER above is a superuser, and superusers skip row-level security. So the tests
      # connect as bruge_owner (owns the database, no superuser, no BYPASSRLS), created below.
      DATABASE_URL: postgresql+psycopg://bruge_owner:bruge_owner@localhost:5432/bruge_test
      TEST_DATABASE_URL: postgresql+psycopg://bruge_owner:bruge_owner@localhost:5432/bruge_test
      # The separate application role; the RLS tests run once as it and once as the owner alone
      # (single-role mode), so both ways of deploying are covered.
      TEST_APP_DATABASE_URL: postgresql+psycopg://bruge_app:bruge_app@localhost:5432/bruge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # The full suite includes the service worker test, which needs node when CI is set.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - name: Create the owner and application roles (throwaway CI credentials)
        run: |
          psql "postgresql://bruge:bruge@localhost:5432/bruge_test" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bruge_owner LOGIN PASSWORD 'bruge_owner' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE bruge_app LOGIN PASSWORD 'bruge_app' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE bruge_test OWNER TO bruge_owner;
          SQL
      - name: alembic upgrade, downgrade, upgrade (single-role mode, no APP_DB_ROLE)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic downgrade base
      - name: alembic upgrade, downgrade, upgrade (APP_DB_ROLE=bruge_app)
        env:
          APP_DB_ROLE: bruge_app
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Full test suite against Postgres (RLS tests in both modes)
        # The 80% coverage gate stays with the SQLite run; Postgres-only tests run here.
        run: uv run pytest --no-cov -rs

  docker:
    name: Docker image and /healthz (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for a CI-only container that is gone when the job ends.
        env:
          POSTGRES_USER: bruge
          POSTGRES_PASSWORD: bruge
          POSTGRES_DB: bruge_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bruge -d bruge_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # postgres:// on purpose: it exercises the URL normalization the Render URLs rely on.
      # bruge_owner is not a superuser: the app refuses to start in production as a superuser or
      # BYPASSRLS role (they skip row-level security), and POSTGRES_USER above is a superuser.
      DB_URL: postgres://bruge_owner:bruge_owner@localhost:5432/bruge_smoke
    steps:
      - uses: actions/checkout@v4
      - name: Create the non-superuser owner role (throwaway CI credentials)
        run: |
          psql "postgresql://bruge:bruge@localhost:5432/bruge_smoke" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bruge_owner LOGIN PASSWORD 'bruge_owner' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE bruge_smoke OWNER TO bruge_owner;
          SQL
      - name: Build the image
        run: docker build --tag bruge-accountant:ci .
      - name: init-db inside the image (same command as preDeployCommand)
        run: >-
          docker run --rm --network host -e DATABASE_URL="$DB_URL"
          bruge-accountant:ci python -m app init-db
      - name: Start the app in production mode
        run: >-
          docker run --detach --name app --network host
          -e PORT=8000 -e ENV=production -e ALLOWED_HOSTS=localhost,127.0.0.1
          -e DATABASE_URL="$DB_URL" -e RENDER_GIT_COMMIT="$GITHUB_SHA"
          bruge-accountant:ci
      - name: Wait for /healthz to return 200 (60 s timeout)
        run: |
          deadline=$((SECONDS + 60))
          until curl --fail --silent --show-error http://localhost:8000/healthz -o health.json; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timeout: /healthz never returned 200"
              docker logs app
              exit 1
            fi
            sleep 2
          done
          cat health.json
          grep -q "\"version\": *\"$GITHUB_SHA\"" health.json
      - name: Error page and headers
        run: |
          curl --silent --dump-header headers.txt --output body.html http://localhost:8000/nope
          cat headers.txt
          head -n 1 headers.txt | grep -q " 404"
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^strict-transport-security:' headers.txt
          grep -qi '^x-request-id:' headers.txt
          if grep -qi '^server:' headers.txt; then echo "server header leaked"; exit 1; fi
          grep -q "Page introuvable" body.html
      - name: Runs as non-root and shuts down cleanly on SIGTERM
        run: |
          test "$(docker exec app id -u)" != "0"
          docker stop --time 10 app
          test "$(docker inspect --format '{{.State.ExitCode}}' app)" = "0"
      - name: Container logs
        if: always()
        run: docker logs app

  docker-e2e:
    name: Docker image and HTTP end-to-end journeys (Postgres 16, separate app role)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        # Throwaway credentials for a CI-only container that is gone when the job ends.
        env:
          POSTGRES_USER: bruge
          POSTGRES_PASSWORD: bruge
          POSTGRES_DB: bruge_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bruge -d bruge_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The owner runs init-db and seed-demo. The app runs as bruge_app: not the owner, not a
      # superuser, no BYPASSRLS, and granted only what migration 0003 gives APP_DB_ROLE.
      OWNER_URL: postgres://bruge_owner:bruge_owner@localhost:5432/bruge_e2e
      APP_URL: postgres://bruge_app:bruge_app@localhost:5432/bruge_e2e
      # The one password of all four demo accounts: a throwaway for this CI run only.
      E2E_PASSWORD: ci-throwaway-Demo-2026
      E2E_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - name: Create the owner and application roles (throwaway CI credentials)
        run: |
          psql "postgresql://bruge:bruge@localhost:5432/bruge_e2e" --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE bruge_owner LOGIN PASSWORD 'bruge_owner' NOSUPERUSER NOBYPASSRLS;
          CREATE ROLE bruge_app LOGIN PASSWORD 'bruge_app' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE bruge_e2e OWNER TO bruge_owner;
          SQL
      - name: Build the image
        run: docker build --tag bruge-accountant:ci .
      - name: init-db as the owner, granting the app role
        run: >-
          docker run --rm --network host -e DATABASE_URL="$OWNER_URL" -e APP_DB_ROLE=bruge_app
          bruge-accountant:ci python -m app init-db
      - name: seed-demo as the owner (password from stdin, fixture mounted read-only)
        # The output goes to a file so it can be checked for the password without echoing it.
        run: |
          printf '%s\n' "$E2E_PASSWORD" |
          docker run --rm -i --network host -e DATABASE_URL="$OWNER_URL" \
            -v "$PWD/tests/fixtures/1OCT.xlsx:/fixture/1OCT.xlsx:ro" \
            bruge-accountant:ci python -m app seed-demo --fixture /fixture/1OCT.xlsx \
            --password-stdin > seed.log 2>&1
          cat seed.log
      - name: The seed-demo output holds no password
        run: |
          if grep -qF -- "$E2E_PASSWORD" seed.log; then
            echo "password leaked"
            exit 1
          fi
      - name: Start the app as the application role
        # Plain http on the runner, so cookies cannot be Secure: development settings, which
        # production refuses (the docker job above covers production mode and HSTS).
        run: >-
          docker run --detach --name app --network host --memory 512m --memory-swap 512m
          -e PORT=8000 -e COOKIE_SECURE=false -e ALLOWED_HOSTS=localhost,127.0.0.1
          -e DATABASE_URL="$APP_URL" -e RENDER_GIT_COMMIT="$GITHUB_SHA"
          bruge-accountant:ci
      - name: Wait for /healthz to return 200 (60 s timeout)
        run: |
          deadline=$((SECONDS + 60))
          until curl --fail --silent --show-error "$E2E_BASE_URL/healthz" -o health.json; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "timeout: /healthz never returned 200"
              docker logs app
              exit 1
            fi
            sleep 2
          done
          cat health.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: End-to-end journeys against the container
        run: uv run pytest tests/e2e --no-cov -v -rs
      - name: The sandbox under the 512 MB cap (Linux limits for real, memory numbers)
        # Runs the real sandbox inside the capped container: RLIMIT_AS, RLIMIT_NPROC (no fork) and
        # RLIMIT_FSIZE are all in force, and the child's peak resident memory is printed.
        run: |
          docker cp tests/fixtures/1OCT.xlsx app:/tmp/1OCT.xlsx
          docker exec app python -c "
          import resource
          from app.parsing.sandbox import parse_in_sandbox
          data = open('/tmp/1OCT.xlsx', 'rb').read()
          report = parse_in_sandbox(data, timeout_s=30, memory_mb=768)
          print('tickets parsed:', len(report.tickets))
          peak = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss / 1024
          print('child peak RSS (MB):', peak)
          "
      - name: Memory of the app container (cgroup)
        run: |
          echo "memory.max     = $(docker exec app cat /sys/fs/cgroup/memory.max)"
          echo "memory.peak    = $(docker exec app cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo unavailable)"
          echo "memory.current = $(docker exec app cat /sys/fs/cgroup/memory.current)"
          docker inspect --format 'OOMKilled={{.State.OOMKilled}}' app
          test "$(docker inspect --format '{{.State.OOMKilled}}' app)" = "false"
      - name: The app log holds no password
        run: |
          if docker logs app 2>&1 | grep -qF -- "$E2E_PASSWORD"; then
            echo "password leaked"
            exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs app

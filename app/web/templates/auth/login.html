{% extends "base.html" %}
{% block title %}{{ _("Connexion") }}{% endblock %}
{% block content %}
<h1>{{ _("Connexion") }}</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  {% include "_csrf.html" %}
  <label for="phone">{{ _("Numéro de téléphone") }}</label>
  <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="username" required maxlength="64">
  <label for="password">{{ _("Mot de passe") }}</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
  <button type="submit">{{ _("Se connecter") }}</button>
</form>
{% endblock %}

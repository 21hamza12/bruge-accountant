<!doctype html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f4c81">
  <meta name="htmx-config" content='{"allowEval":false,"includeIndicatorStyles":false,"historyCacheSize":0}'>
  <title>{% block title %}{{ _("Bruge Accountant") }}{% endblock %}</title>
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="icon" href="/static/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/register-sw.js" defer></script>
</head>
<body{% if csrf_token %} data-csrf-token="{{ csrf_token }}" data-hx-headers='{{ {"X-CSRF-Token": csrf_token}|tojson }}'{% endif %}>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

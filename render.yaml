# Render Blueprint: one Docker web service plus a private managed Postgres, both in Frankfurt.
# Secrets are never written here: `sync: false` values are entered in the dashboard and
# `fromDatabase` values are injected by Render. Setup steps: docs/runbook.md.
databases:
  - name: bruge-db
    region: frankfurt
    plan: basic-256mb
    databaseName: bruge
    postgresMajorVersion: "16"
    ipAllowList: []  # no public access; reach it from the web service (Render Shell)

services:
  - type: web
    name: bruge-accountant
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    preDeployCommand: python -m app init-db
    autoDeploy: false
    envVars:
      - key: ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"  # to be confirmed in the runbook
      - key: ALLOWED_HOSTS
        value: replace-me.onrender.com  # placeholder: set the real host(s) first (runbook)
      - key: MIGRATION_DATABASE_URL  # owner role, used only by preDeployCommand
        fromDatabase:
          name: bruge-db
          property: connectionString
      - key: DATABASE_URL  # dashboard: owner URL for now, the bruge_app role after PR 2
        sync: false
      - key: SENTRY_DSN
        sync: false
